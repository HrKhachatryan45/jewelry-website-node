<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Jewelry — Ձևակերպում</title>
    <meta name="description" content="Luxe Jewelry - հայկական ոսկերչական տուն">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/assets/css/site.css">
    <script type="module" src="/js/api.js"></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script type="module" src="/js/pages/checkout.js" defer></script>
</head>
<body data-page="checkout">
    <div id="header-slot"></div>
    <main>
        <!-- Breadcrumb -->
        <nav class="bg-luxe-black border-b border-border/10 pt-24 md:pt-32">
            <div class="container mx-auto px-6 py-4">
                <ol class="flex items-center gap-3 text-[10px] uppercase tracking-[0.2em] text-white/40">
                    <li><a href="/" class="hover:text-luxe-gold transition-colors">Գլխավոր</a></li>
                    <li>/</li>
                    <li><a href="/cart" class="hover:text-luxe-gold transition-colors">Զամբյուղ</a></li>
                    <li>/</li>
                    <li class="text-luxe-gold">Ձևակերպում</li>
                </ol>
            </div>
        </nav>

        <section class="bg-white py-12 md:py-24">
            <div class="container mx-auto max-w-6xl px-6">
                <div class="mb-3">
                    <span class="text-[10px] uppercase tracking-[0.5em] text-luxe-gold mb-4 block">Վերջին Քայլը</span>
                    <h1 class="text-3xl md:text-6xl font-heading font-normal text-luxe-black uppercase tracking-tight">Պատվերի ձևակերպում</h1>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 xl:gap-24">

                    <!-- Checkout Form -->
                    <div class="lg:col-span-7">
                        <form id="checkoutForm" class="space-y-6">
                            <div class="space-y-2 ">
                                <label class="text-[8px] uppercase tracking-widest text-luxe-black/40 block">Ստացման Եղանակ</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <label class="cursor-pointer">
                                        <input type="radio" name="delivery_type" value="pickup" class="peer sr-only">
                                        <div class="border border-border/20 py-3 flex flex-col items-center justify-center gap-2 peer-checked:border-luxe-gold peer-checked:text-luxe-gold transition-colors hover:border-luxe-gold/50 text-luxe-black/60">
                                           <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7v2H2V7z"/><path d="M2 12h20v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5z"/><path d="M7 12v-3"/><path d="M12 12v-3"/><path d="M17 12v-3"/></svg>
                                            <span class="text-[9px] uppercase tracking-widest">Սրահից</span>
                                        </div>
                                    </label>
                                    <label class="cursor-pointer">
                                        <input type="radio" name="delivery_type" value="delivery" class="peer sr-only" checked>
                                        <div class="border border-border/20 py-3 flex flex-col items-center justify-center gap-2 peer-checked:border-luxe-gold peer-checked:text-luxe-gold transition-colors hover:border-luxe-gold/50 text-luxe-black/60">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                                            <span class="text-[9px] uppercase tracking-widest">Առաքում</span>
                                        </div>
                                    </label>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <div class="space-y-1">
                                    <label class="text-[8px] uppercase tracking-widest text-luxe-black/40">Անուն Ազգանուն</label>
                                    <input type="text" name="full_name" required class="w-full bg-transparent border-b border-border/20 py-3 text-xs focus:border-luxe-gold outline-none">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[8px] uppercase tracking-widest text-luxe-black/40">Հեռախոս</label>
                                    <input type="tel" name="phone" required class="w-full bg-transparent border-b border-border/20 py-3 text-xs focus:border-luxe-gold outline-none">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[8px] uppercase tracking-widest text-luxe-black/40">Էլ. փոստ</label>
                                    <input type="email" name="email" required class="w-full bg-transparent border-b border-border/20 py-3 text-xs focus:border-luxe-gold outline-none">
                                </div>

                                <input type="hidden" id="lat" name="lat">
                                <input type="hidden" id="lng" name="lng">
                                <input type="hidden" id="delivery_price" name="delivery_price" value="0">
                                <input type="hidden" id="city" name="city" value="">

                                <div id="addressSection" class="space-y-4">
                                    <div class="space-y-1">
                                        <label for="address" class="text-[8px] uppercase tracking-widest text-luxe-black/40">Հասցե *</label>
                                        <div class="ac-wrap relative">
                                            <textarea id="address" name="address" rows="2" required class="w-full bg-transparent border-b border-border/20 py-3 text-xs focus:border-luxe-gold outline-none resize-none" placeholder="Սկսեք մուտքագրել հասցեն..." autocomplete="off"></textarea>
                                            <div class="ac-dropdown absolute w-full bg-white border border-border/10 shadow-lg z-50 top-full left-0 hidden" id="cityDropdown"></div>
                                        </div>
                                        <p class="error-message text-[10px] text-red-500 mt-1" id="address-error" role="alert" aria-live="polite"></p>
                                    </div>
                                </div>

                                <div id="pickupSection" class="hidden space-y-4 p-6 bg-luxe-black/[0.02] border border-border/10">
                                    <div class="flex items-start gap-4">
                                        <div class="w-10 h-10 bg-luxe-gold/10 text-luxe-gold flex items-center justify-center shrink-0">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                        </div>
                                        <div>

                                            <p class="text-[11px] text-luxe-black/60 leading-relaxed">
                                                <span id="pickup-address">Մաշտոցի պողոտա, Երևան</span><br>
                                                Աշխատանքային ժամերը: 10:00 - 20:00
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div id="deliveryTag" class="hidden items-center gap-2 mt-2 text-[10px] uppercase tracking-widest text-luxe-black/60">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>

                                </div>

                                </div>

                                    </div>
                                    <p class="error-message text-[10px] text-red-500 mt-1" id="delivery_time-error" role="alert" aria-live="polite"></p>
                                </div>

                                    <label class="text-[8px] uppercase tracking-widest text-luxe-black/40 block">Վճարման Եղանակ</label>
                                    <div class="grid grid-cols-3 gap-2">

                                            </div>
                                        </label>
                                        <label class="cursor-pointer">
                                            <input type="radio" name="payment_method" value="card" class="peer sr-only">
                                            <div class="border border-border/20 py-3 flex flex-col items-center justify-center gap-2 peer-checked:border-luxe-gold peer-checked:text-luxe-gold transition-colors hover:border-luxe-gold/50 text-luxe-black/60">
                                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"></path></svg>
                                                <span class="text-[9px] uppercase tracking-widest">Քարտ</span>
                                            </div>
                                        </label>

                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Summary Sidebar -->
                    <div class="lg:col-span-5">
                        <div class="bg-section-alt p-10 space-y-10 sticky top-32">
                            <div>
                                <h2 class="text-xs uppercase tracking-[0.3em] text-luxe-black mb-8">Ամփոփում</h2>
                                <div class="space-y-4 pb-8 border-b border-border/10" id="summary-items"></div>
                                <div class="flex justify-between items-center pt-8">
                                    <span class="text-xs uppercase tracking-[0.3em] text-luxe-black font-medium">Ընդամենը</span>
                                    <span class="text-2xl font-light text-luxe-black" id="grand-total"></span>
                                </div>
                            </div>

                            <button type="button" id="submitOrder" class="w-full btn-luxe btn-luxe-primary h-16 uppercase tracking-[0.3em] text-[10px]">
                                Հաստատել Պատվերը
                            </button>

                            <p class="text-[9px] text-luxe-black/30 text-center leading-relaxed">
                                Պատվերը հաստատելուց հետո մենք կկապնվենք Ձեզ հետ՝ մանրամասները ճշտելու համար։
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-slot"></div>
    <div id="toast-slot"></div>
