<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Jewelry — Զամբյուղ</title>
    <meta name="description" content="Luxe Jewelry - հայկական ոսկերչական տուն">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/assets/css/site.css">
    <script type="module" src="/js/api.js"></script>
    <script src="/js/i18n.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script type="module" src="/js/pages/cart.js" defer></script>
</head>
<body data-page="cart">
    <div id="header-slot"></div>
    <main>
        <!-- Breadcrumb -->
        <nav class="bg-luxe-black border-b border-border/10 pt-24 md:pt-32">
            <div class="container mx-auto px-6 py-4">
                <ol class="flex items-center gap-3 text-[10px] uppercase tracking-[0.2em] text-white/40">
                    <li><a href="/" class="hover:text-luxe-gold transition-colors">Գլխավոր</a></li>
                    <li>/</li>
                    <li><a href="/collection" class="hover:text-luxe-gold transition-colors">Հավաքածու</a></li>
                    <li>/</li>
                    <li class="text-luxe-gold">Զամբյուղ</li>
                </ol>
            </div>
        </nav>

        <section class="bg-white py-12 md:py-24">
            <div class="container mx-auto px-6">
                <div class="flex flex-col lg:flex-row-reverse justify-between items-start lg:items-end gap-8 mb-16">
                    <div>
                        <span class="text-[10px] uppercase tracking-[0.5em] text-luxe-gold mb-4 block">Ձեր Ընտրությունը</span>
                        <h1 class="text-3xl md:text-6xl font-heading font-normal text-luxe-black uppercase tracking-tight">Զամբյուղ</h1>
                    </div>
                    <button type="button" id="clear-cart" class="hidden text-[10px] uppercase tracking-widest text-luxe-black/40 hover:text-red-500 transition-colors flex items-center gap-2 group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:rotate-12 transition-transform"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        Մաքրել զամբյուղը
                    </button>
                </div>

                <!-- Cart with items -->
                <div id="cart-grid" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-16 xl:gap-24">

                    <!-- Items List -->
                    <div id="cart-items" class="lg:col-span-8 space-y-8"></div>

                    <!-- Summary Sidebar -->
                    <div class="lg:col-span-4">
                        <div class="bg-section-alt p-10 space-y-10 sticky top-32">
                            <div>
                                <h2 class="text-xs uppercase tracking-[0.3em] text-luxe-black mb-8">Ամփոփում</h2>
                                <div class="space-y-4 pb-8 border-b border-border/10" id="summary-lines"></div>
                                <div class="flex justify-between items-center pt-8 mb-8">
                                    <span class="text-xs uppercase tracking-[0.3em] text-luxe-black font-medium">Ընդամենը</span>
                                    <span class="text-2xl font-light text-luxe-black" id="grand-total"></span>
                                </div>
                                <a href="/checkout" id="checkout-link" class="w-full btn-luxe btn-luxe-primary h-16 uppercase tracking-[0.3em] text-[10px] flex items-center justify-center">
                                    Անցնել Վճարման
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Empty cart -->
                <div id="cart-empty" class="hidden py-32 text-center space-y-10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1" class="mx-auto opacity-20">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <div class="space-y-4">
                        <h2 class="text-2xl font-heading uppercase tracking-widest text-luxe-black">Զամբյուղը դատարկ է</h2>
                        <p class="text-white/40 text-sm font-light">Բացահայտեք մեր հավաքածուն և գտեք ձեր կատարյալ զարդը։</p>
                    </div>
                    <a href="/collection" class="inline-block btn-luxe btn-luxe-primary">
                        Դեպի Հավաքածու
                    </a>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-slot"></div>
    <div id="toast-slot"></div>
</body>
</html>
