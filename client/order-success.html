<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Jewelry - Պատվերը ընդունված է</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/assets/css/site.css">
    <script src="/js/i18n.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id');
        if (params.get('pm') === 'cash' && /^\d+$/.test(orderId || '')) {
            window.location.replace(`/account/orders/${orderId}`);
        }
    </script>
</head>
<body>
    <div id="header-slot"></div>
    <main class="section-padding text-center">
        <h1 class="font-heading text-3xl mb-4">Պատվերը հաջողությամբ ընդունված է</h1>
        <p class="mb-8">Շնորհակալություն։ Մենք շուտով կկապվենք ձեզ հետ։</p>
        <a href="/" class="btn-luxe btn-luxe-primary">Գլխավոր էջ</a>
    </main>
    <div id="footer-slot"></div>
    <div id="toast-slot"></div>
</body>
</html>
